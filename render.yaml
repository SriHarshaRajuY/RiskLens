services:
  - type: web
    name: risklens-api
    runtime: node
    rootDir: .
    buildCommand: npm install --include=dev --offline=false --no-audit --no-fund && npm run build --workspace server
    startCommand: npm run start:render --workspace server
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        sync: false
      - key: SERVER_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_ISSUER
        value: risklens-api
      - key: JWT_AUDIENCE
        value: risklens-web
      - key: REFRESH_TOKEN_EXPIRES_DAYS
        value: 7
      - key: COOKIE_SAME_SITE
        value: none
      - key: CLIENT_URLS
        sync: false
      - key: MARKET_DATA_PROVIDER
        value: alpha_vantage
      - key: ALPHA_VANTAGE_API_KEY
        sync: false
      - key: MARKET_DATA_FALLBACK
        value: demo
      - key: CACHE_TTL_SECONDS
        value: 45
      - key: CSV_BATCH_SIZE
        value: 500
