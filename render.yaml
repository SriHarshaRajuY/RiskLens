services:
  - type: web
    name: risklens-api
    runtime: node
    rootDir: .
    buildCommand: npm install --offline=false --no-audit --no-fund && npm run build --workspace server
    startCommand: npm run start --workspace server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CLIENT_URL
        sync: false
      - key: SERVER_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_ISSUER
        value: risklens-api
      - key: JWT_AUDIENCE
        value: risklens-web
      - key: REFRESH_TOKEN_EXPIRES_DAYS
        value: 7
      - key: COOKIE_SAME_SITE
        value: none
      - key: CLIENT_URLS
        sync: false
      - key: ALPHA_VANTAGE_API_KEY
        sync: false
  - type: worker
    name: risklens-workers
    runtime: node
    rootDir: .
    buildCommand: npm install --offline=false --no-audit --no-fund && npm run build --workspace server
    startCommand: npm run start:workers --workspace server
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_ISSUER
        value: risklens-api
      - key: JWT_AUDIENCE
        value: risklens-web
      - key: REFRESH_TOKEN_EXPIRES_DAYS
        value: 7
      - key: ALPHA_VANTAGE_API_KEY
        sync: false
